name: Golden nightly
# Live contract: NIL p25/p50/p75 are null. Do not echo a dollar, MAE, or composite.
on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/golden/test_pose_pipeline.py -q
      - run: python -m services.golden_set.harness
