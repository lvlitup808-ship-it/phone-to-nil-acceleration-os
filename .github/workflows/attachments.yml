name: Attachments
# Live contract: NIL p25/p50/p75 are null. Do not echo a dollar, MAE, or composite.
on:
  pull_request:
    paths: ["docs/attachments/**"]
jobs:
  ingest-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Attachment checklist present
        run: |
          test -f docs/attachments/README.md
          test -f docs/attachments/links.md
          test -f docs/attachments/x-posts.md
