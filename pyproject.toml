[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phone-to-nil-acceleration-os"
version = "0.1.0"
description = "Phone-video football acceleration biomechanics to NIL/recruiting valuation band."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "LVLITUP" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.32",
  "psycopg2-binary>=2.9.9",
  "redis>=5.0.0",
  "httpx>=0.27.0",
  "numpy>=1.26.0",
  "opencv-python-headless>=4.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.6.0", "mypy>=1.10"]
cv = ["mediapipe>=0.10.14"]
judgment = ["typesafe-sdk>=0.1.0"]

[tool.setuptools.packages.find]
include = ["services*", "packages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
ignore_missing_imports = true

[tool.ruff.lint]
# Explicit so results do not change with the installed ruff version.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4"]
# UP042 (StrEnum) would change str() of API enums; keep (str, Enum).
ignore = ["UP042"]
