services:
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    depends_on:
      - db
      - redis

  cv-worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    env_file:
      - .env.example
    depends_on:
      - redis

  valuation:
    build:
      context: .
      dockerfile: infra/docker/valuation.Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env.example
    depends_on:
      - db

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: accel
      POSTGRES_PASSWORD: accel
      POSTGRES_DB: accel_os
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
