name: Docs
# Live contract: NIL p25/p50/p75 are null. Do not echo a dollar, MAE, or composite.
on:
  pull_request:
    paths: ["docs/**", "README.md"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Required docs exist
        run: |
          test -f README.md
          test -f docs/legal/nil-disclaimer.md
          test -f docs/jev-judgments.md
          test -f docs/rag-evidence.md
          test -d docs/attachments
